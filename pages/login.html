<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CataBook - Login">
  <title>Login - CataBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 auth-page">
  <div class="container-custom">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6 col-xl-6">
        <div class="d-flex justify-content-end mb-3">
          <div id="theme-toggle-container"></div>
        </div>
        <div class="card shadow-lg border-0">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <svg class="mb-3" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <h1 class="h3 fw-bold text-primary">CataBook</h1>
              <p class="text-muted">Faça login para acessar sua biblioteca</p>
            </div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label-custom">Email</label>
                <div class="input-group-custom">
                  <span class="input-group-text" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                  </span>
                  <input type="email" id="email" name="email" class="form-control-custom" placeholder="seu@email.com" autocomplete="email" required aria-describedby="email-error">
                </div>
                <div class="invalid-feedback" id="email-error"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label-custom">Senha</label>
                <div class="input-group-custom">
                  <span class="input-group-text" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  </span>
                  <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" autocomplete="current-password" required aria-describedby="password-error">
                  <button type="button" class="btn btn-link text-muted p-0 ms-2" id="toggle-password" aria-label="Mostrar senha">
                    <svg id="password-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
                <div class="invalid-feedback" id="password-error"></div>
              </div>

              <div class="mb-3 d-flex align-items-center justify-content-between">
                <label class="form-check mb-0">
                  <input type="checkbox" class="form-check-input" id="remember">
                  <span class="form-check-label small">Lembrar-me</span>
                </label>
                <a href="#" class="small" id="forgot-password">Esqueci minha senha</a>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary-custom btn-lg w-100 mb-3">
                Entrar
              </button>
            </form>

            <div class="text-center">
              <p class="mb-0 text-muted">Não tem conta? <a href="register.html" class="fw-medium">Cadastre-se</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center loading-overlay" style="z-index: 9999;">
    <div class="text-center">
      <div class="spinner spinner-lg text-primary mb-3"></div>
      <p class="text-muted">Entrando...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    import { createThemeToggleButton } from '../assets/js/theme.js';
    document.getElementById('theme-toggle-container').appendChild(createThemeToggleButton());
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password');
      const passwordEye = document.getElementById('password-eye');
      const submitBtn = document.getElementById('submit-btn');
      const loadingOverlay = document.getElementById('loading-overlay');

      toggleBtn.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        passwordEye.innerHTML = type === 'password'
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
          : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      });

      async function doLogin() {
        let valid = true;
        [emailInput, passwordInput].forEach(input => input.classList.remove('is-invalid'));

        if (!emailInput.value.trim()) {
          emailInput.classList.add('is-invalid');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
          emailInput.classList.add('is-invalid');
          valid = false;
        }

        if (!passwordInput.value) {
          passwordInput.classList.add('is-invalid');
          valid = false;
        }

        if (!valid) return;

        loadingOverlay.classList.remove('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner spinner-sm me-2"></span>Entrando...';

        try {
          const { auth } = await import('../assets/js/auth.js');
          await auth.login({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });
          window.location.href = 'book-list.html';
        } catch (error) {
          console.error('Login error:', error);
          loadingOverlay.classList.add('d-none');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';

          if (error.message.includes('credenciais') || error.message.includes('inválid') || error.message.includes('401')) {
            passwordInput.classList.add('is-invalid');
            document.getElementById('password-error').textContent = 'Email ou senha incorretos';
          } else {
            window.showToast?.('Erro ao fazer login: ' + error.message, 'error');
          }
        }
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        doLogin();
      });
    });
  </script>
</body>
</html>
